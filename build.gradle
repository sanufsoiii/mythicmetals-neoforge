plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'mythicmetals-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    owoInterfaceInjection { transitive = false }
}

var extractOwoInterfaceInjections = tasks.register('extractOwoInterfaceInjections', Copy) {
    from({ zipTree(configurations.owoInterfaceInjection.singleFile) }) { include 'interfaces.json' }
    into layout.buildDirectory.dir('owoInterfaceInjection')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically

    // owo-lib interface injection data (Loom did this on Fabric).
    interfaceInjectionData {
        from(extractOwoInterfaceInjections.map { it.destinationDir.toPath().resolve('interfaces.json').toFile() })
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Smoke test: the client must reach the title screen and exit by itself.
        // The mod reads -Dmythicmetals.port.exitOnTitle=true.
        clientSmoke {
            client()
            systemProperty 'mythicmetals.port.exitOnTitle', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources.srcDir 'src/main/generated'

repositories {
    mavenLocal() {
        content { includeModule('io.wispforest', 'alloy-forgery-neoforge') }
    }
    maven { name = 'WispForest (owo-lib)'; url = 'https://maven.wispforest.io/releases' }
    maven { name = 'Sinytra (forgified-fabric-api, needed by owo-lib-neoforge)'; url = 'https://maven.su5ed.dev/releases' }
    maven {
        name = 'Modrinth'; url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    // owo-lib: official NeoForge build (same 0.12.x API). Config wrapper MythicMetalsConfig is generated by its annotation processor.
    implementation "io.wispforest:owo-lib-neoforge:${owo_version}"
    annotationProcessor "io.wispforest:owo-lib-neoforge:${owo_version}"
    owoInterfaceInjection "io.wispforest:owo-lib-neoforge:${owo_version}"

    // Additional Entity Attributes: official NeoForge 1.21.1 build, same API (Holder<Attribute> fields). Bundled like on Fabric.
    implementation "maven.modrinth:additionalentityattributes:${aea_version}"
    jarJar "maven.modrinth:additionalentityattributes:${aea_version}"

    // Alloy Forgery (our port, ../../alloy-forgery/port, published to mavenLocal). Mythic Metals has no
    // compile-time reference to it: the alloy forges and recipes are pure data (data/mythicmetals/alloy_forges, recipes).
    runtimeOnly "io.wispforest:alloy-forgery-neoforge:${alloyforgery_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            owo_version            : owo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

jar {
    from('LICENSE') { rename { "${it}_mythicmetals" } }
}
