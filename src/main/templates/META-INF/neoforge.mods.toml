modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/sanufsoiii/mythicmetals-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="mythicmetals.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="owo"
type="required"
versionRange="[0.12.15,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="alloy_forgery"
type="required"
versionRange="[2.4.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="additionalentityattributes"
type="required"
versionRange="[2.0.2,)"
ordering="AFTER"
side="BOTH"
